<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBC Repository & Tracker - Toko ASMD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#0284c7', 600: '#0369a1', 700: '#0369a1' }
                    }
                }
            }
        }
    </script>
    <style>
        /* PENGATURAN KHUSUS UNTUK CETAK KERTAS (PRINTSHEET) */
        @media print {
            @page { size: portrait; margin: 8mm; }
            body { background-color: white !important; color: black !important; font-size: 9px !important; }
            .no-print { display: none !important; }
            main { padding: 0 !important; margin: 0 !important; max-width: 100% !important; }
            .print-workspace { border: none !important; box-shadow: none !important; overflow: visible !important; }
            table { border-collapse: collapse !important; width: 100% !important; }
            th, td { 
                border: 1px solid #000 !important; 
                padding: 3px 4px !important; 
                font-size: 9px !important; 
                line-height: 1.2 !important;
                color: black !important; 
            }
            th { background-color: #f1f5f9 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .print-box { border-bottom: 1px dashed #000 !important; width: 100%; min-height: 12px; display: inline-block; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50 no-print">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-500 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-boxes-stacked text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">SBC REPOSITORY & TRACKER</h1>
                    <p class="text-xs text-slate-400">Partial Stock Check System - Toko ASMD</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <select id="storeSelect" class="bg-slate-800 text-xs font-semibold text-slate-200 border border-slate-700 rounded-lg px-3 py-2">
                    <option value="ASMD" selected>Toko ASMD (Active)</option>
                </select>
                <button id="btnSync" onclick="fetchSheetData()" class="bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center space-x-2">
                    <i class="fa-solid fa-rotate" id="syncIcon"></i>
                    <span class="hidden sm:inline">Sync DB</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
        
        <div id="syncStatusAlert" class="hidden mb-4 p-3 rounded-lg text-xs font-medium flex items-center justify-between no-print">
            <span id="syncStatusText"></span>
        </div>

        <!-- CONTROLS & SLICER FILTER -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 mb-6 shadow-sm no-print">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
                
                <!-- SLICER SHEET / RAK -->
                <div class="md:col-span-3">
                    <div class="relative">
                        <i class="fa-solid fa-layer-group absolute left-3 top-3 text-brand-600 text-xs"></i>
                        <select id="sheetSlicer" onchange="changeSheet(this.value)" class="w-full pl-8 pr-4 py-2 bg-brand-50/50 border border-brand-200 font-semibold rounded-lg text-xs text-brand-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500">
                        </select>
                    </div>
                </div>

                <!-- SEARCH BAR -->
                <div class="md:col-span-3 relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
                    <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Cari SKU, Barcode..." class="w-full pl-8 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>

                <!-- STATUS FILTER -->
                <div class="md:col-span-2">
                    <select id="filterStatus" onchange="applyFilters()" class="w-full py-2 px-3 bg-slate-50 border border-slate-300 rounded-lg text-xs text-slate-700">
                        <option value="ALL">Semua Status</option>
                        <option value="UNCHECKED">Belum Dicek</option>
                        <option value="MATCH">Akurat (0)</option>
                        <option value="MINUS">Selisih (-)</option>
                        <option value="PLUS">Selisih (+)</option>
                    </select>
                </div>

                <!-- ACTION BUTTONS -->
                <div class="md:col-span-4 flex space-x-2">
                    <!-- Hidden file input untuk TXT -->
                    <input type="file" id="fileTxt" accept=".txt" class="hidden" onchange="handleFileUpload(event)">
                    
                    <button onclick="document.getElementById('fileTxt').click()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] sm:text-xs font-semibold py-2 rounded-lg flex items-center justify-center space-x-1" title="Upload Scan TXT">
                        <i class="fa-solid fa-upload"></i>
                        <span class="hidden xl:inline">Upload TXT</span>
                    </button>

                    <button onclick="copyDataForGS()" class="flex-1 bg-teal-600 hover:bg-teal-500 text-white text-[10px] sm:text-xs font-semibold py-2 rounded-lg flex items-center justify-center space-x-1" title="Copy untuk di-paste ke GS">
                        <i class="fa-solid fa-copy"></i>
                        <span class="hidden xl:inline">Copy ke GS</span>
                    </button>
                    
                    <button onclick="exportToCSV()" class="w-10 sm:w-12 bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold py-2 rounded-lg flex items-center justify-center" title="Export CSV">
                        <i class="fa-solid fa-file-csv"></i>
                    </button>
                    
                    <button onclick="window.print()" class="w-10 sm:w-12 bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold py-2 rounded-lg flex items-center justify-center" title="Cetak Printsheet">
                        <i class="fa-solid fa-print"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- TABLE WORKSPACE -->
        <div class="print-workspace bg-white rounded-xl border border-slate-200 overflow-x-auto shadow-sm">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-100 text-slate-600 text-[11px] font-bold uppercase tracking-wider border-b border-slate-200">
                        <th class="py-3 px-3 text-center">No</th>
                        <th class="py-3 px-3">SKU</th>
                        <th class="py-3 px-3 min-w-[200px]">Deskripsi</th>
                        <th class="py-3 px-3">Alamat</th>
                        <th class="py-3 px-3 text-right">Price</th>
                        <th class="py-3 px-3 text-center">KS</th>
                        <th class="py-3 px-3 text-right">SYS</th>
                        <th class="py-3 px-3 text-center w-20">PHY</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody" class="divide-y divide-slate-200 text-xs text-slate-700">
                </tbody>
            </table>
            <div id="emptyState" class="hidden p-8 text-center text-slate-400 no-print">
                <i class="fa-solid fa-box-open text-3xl mb-2"></i>
                <p class="text-sm font-medium" id="emptyStateMsg">Tidak ada data. Silakan Sync DB atau Upload TXT.</p>
            </div>
        </div>

    </main>

    <script>
        const SPREADSHEET_ID = '1Ft7xFLiaHN5KDNZxBvrmsOl_o2K2UhMn0B21tPB8V70';
        
        const AVAILABLE_SHEETS = [
            { name: 'KS', label: 'KEEPSTOCK (KS)' },
            { name: 'OLAHAN NUSANTARA', label: 'OLAHAN NUSANTARA' },
            { name: 'KASIR', label: 'KASIR' },
            { name: 'AG01/Gondola Promo', label: 'AG01 / GONDOLA PROMO' },
            { name: 'STATIONERY', label: 'STATIONERY' },
            { name: 'DATA AREA', label: 'DATA AREA' }
        ];

        let activeSheet = AVAILABLE_SHEETS[0].name;
        let rawData = []; // Data asli dari Google Sheet (Database)
        let displayData = []; // Data yang ditampilin di tabel (bisa hasil filter GS atau hasil TXT)

        document.addEventListener('DOMContentLoaded', () => {
            initSlicerOptions();
            fetchSheetData();
        });

        function initSlicerOptions() {
            const slicerSelect = document.getElementById('sheetSlicer');
            slicerSelect.innerHTML = '';
            AVAILABLE_SHEETS.forEach(sheet => {
                const opt = document.createElement('option');
                opt.value = sheet.name;
                opt.innerText = `Area: ${sheet.label}`;
                if(sheet.name === activeSheet) opt.selected = true;
                slicerSelect.appendChild(opt);
            });
        }

        function changeSheet(selectedSheetName) {
            activeSheet = selectedSheetName;
            fetchSheetData();
        }

        async function fetchSheetData() {
            const syncIcon = document.getElementById('syncIcon');
            syncIcon.classList.add('fa-spin');
            showStatusAlert(`Menarik database dari area: ${activeSheet}...`, 'bg-blue-50 text-blue-700 border border-blue-200');

            const gvizUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(activeSheet)}`;

            try {
                const response = await fetch(gvizUrl);
                const text = await response.text();
                const jsonText = text.substring(47, text.length - 2);
                const json = JSON.parse(jsonText);
                
                if (json.table && json.table.rows) {
                    rawData = parseRowsByColumnStructure(json.table.rows);
                    showStatusAlert(`Database ${activeSheet} berhasil ditarik! Siap di-mix sama file TXT.`, 'bg-emerald-50 text-emerald-700 border border-emerald-200');
                } else {
                    rawData = [];
                }
            } catch (error) {
                showStatusAlert('Gagal membaca sheet database.', 'bg-rose-50 text-rose-700 border border-rose-200');
                rawData = [];
            } finally {
                syncIcon.classList.remove('fa-spin');
                applyFilters();
            }
        }

        function parseRowsByColumnStructure(rows) {
            const parsed = [];
            rows.forEach((row) => {
                const c = row.c;
                if (!c || c.length === 0) return;
                const sku = c[0] && c[0].v !== null ? String(c[0].v) : '';
                if (!sku || sku.toUpperCase() === 'SKU') return;

                const desc = c[1] && c[1].v !== null ? String(c[1].v) : '-';
                const alamat = c[2] && c[2].v !== null ? String(c[2].v) : '-';
                const price = c[3] && c[3].v !== null ? Number(c[3].v) : 0;
                const ks = c[4] && c[4].v !== null ? String(c[4].v) : '-';
                const sys = c[5] && c[5].v !== null ? Number(c[5].v) : 0;
                const phyRaw = c[6] ? c[6].v : null;
                
                let phy = null;
                if (phyRaw !== null && phyRaw !== undefined && phyRaw !== '') {
                    phy = Number(phyRaw);
                }

                parsed.push({
                    sku: sku, barcode: sku, desc: desc, alamat: alamat,
                    price: isNaN(price) ? 0 : price, ks: ks,
                    sys: isNaN(sys) ? 0 : sys, phy: isNaN(phy) ? null : phy
                });
            });
            return parsed;
        }

        // FITUR BARU: BACA FILE TXT
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                const lines = content.split(/\r?\n/);
                
                let scannedItems = [];

                lines.forEach(line => {
                    if (!line.trim()) return;
                    
                    // Format dari scanner lu: s,alamat,sku
                    const parts = line.split(',');
                    if (parts.length >= 3) {
                        const alamatScan = parts[1].trim();
                        const skuScan = parts[2].trim();
                        
                        // Buang duplikat SKU biar printsheet rapi
                        const existing = scannedItems.find(item => item.sku === skuScan);
                        if (!existing) {
                            // Cari data lengkap (Desc & Sys) di database yang udah ditarik
                            const dbMatch = rawData.find(item => item.sku === skuScan);
                            
                            if (dbMatch) {
                                scannedItems.push({
                                    sku: skuScan,
                                    barcode: dbMatch.barcode,
                                    desc: dbMatch.desc,
                                    alamat: alamatScan, // Pake alamat aktual hasil scan
                                    price: dbMatch.price,
                                    ks: dbMatch.ks,
                                    sys: dbMatch.sys, // Ambil Qty sistem dari DB
                                    phy: null // Dikosongin sesuai request lu
                                });
                            } else {
                                // Kalau ga ketemu di database aktif
                                scannedItems.push({
                                    sku: skuScan, barcode: skuScan,
                                    desc: "SKU TIDAK ADA DI DB",
                                    alamat: alamatScan, price: 0, ks: "-",
                                    sys: 0, phy: null
                                });
                            }
                        }
                    }
                });

                // Timpa tabel dengan hasil olahan TXT
                displayData = scannedItems;
                renderTable();
                
                event.target.value = ''; // Reset input
                showStatusAlert(`Berhasil memproses ${scannedItems.length} SKU dari file TXT!`, 'bg-emerald-50 text-emerald-700 border border-emerald-200');
            };
            reader.readAsText(file);
        }

        // FITUR BARU: COPY PASTE LANGSUNG KE GS
        function copyDataForGS() {
            if (displayData.length === 0) return alert('Tidak ada data untuk di-copy.');
            
            let tsv = '';
            displayData.forEach(item => {
                // Susunan kolom dibuat persis kayak GS lu: SKU | DESC | ALAMAT | PRICE | KS | SYS | PHY (Kosong)
                tsv += `${item.sku}\t${item.desc}\t${item.alamat}\t${item.price}\t${item.ks}\t${item.sys}\t\n`;
            });
            
            navigator.clipboard.writeText(tsv).then(() => {
                alert('Berhasil di-copy, bro! Silakan paste (Ctrl+V) di baris kosong Google Sheet lu.');
            }).catch(err => {
                alert('Gagal copy: ' + err);
            });
        }

        function applyFilters() {
            // Ini kalau lu lagi nggak pakai file TXT dan pengen liat raw data aja
            const searchValue = document.getElementById('searchInput').value.toLowerCase().trim();
            const statusValue = document.getElementById('filterStatus').value;

            displayData = rawData.filter(item => {
                const matchSearch = item.sku.toLowerCase().includes(searchValue) || item.desc.toLowerCase().includes(searchValue);
                let matchStatus = true;
                const varVal = item.phy !== null ? (item.phy - item.sys) : null;

                if (statusValue === 'MINUS') matchStatus = item.phy !== null && varVal < 0;
                else if (statusValue === 'PLUS') matchStatus = item.phy !== null && varVal > 0;
                else if (statusValue === 'MATCH') matchStatus = item.phy !== null && varVal === 0;
                else if (statusValue === 'UNCHECKED') matchStatus = item.phy === null;

                return matchSearch && matchStatus;
            });
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('inventoryTableBody');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';

            if (displayData.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            displayData.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors border-b border-slate-100";
                const isChecked = item.phy !== null;
                const formattedPrice = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(item.price);

                tr.innerHTML = `
                    <td class="py-2.5 px-3 text-center text-slate-400 font-mono">${index + 1}</td>
                    <td class="py-2.5 px-3 font-mono font-bold text-slate-900">${item.sku}</td>
                    <td class="py-2.5 px-3 font-medium text-slate-800">${item.desc}</td>
                    <td class="py-2.5 px-3 font-mono text-slate-500">${item.alamat}</td>
                    <td class="py-2.5 px-3 text-right font-mono text-slate-600">${formattedPrice}</td>
                    <td class="py-2.5 px-3 text-center">
                        <span class="px-1.5 py-0.5 text-[10px] font-semibold rounded ${item.ks !== '#N/A' && item.ks !== '-' ? 'bg-indigo-50 text-indigo-700' : 'text-slate-400'}">${item.ks}</span>
                    </td>
                    <td class="py-2.5 px-3 text-right font-mono font-semibold text-slate-700">${item.sys}</td>
                    <td class="py-2.5 px-3 text-center">
                        ${isChecked ? `<span class="font-mono font-bold text-brand-700 text-base">${item.phy}</span>` : '<span class="print-box w-10 mx-auto border-b-2 border-slate-300"></span>'}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
        
        function showStatusAlert(msg, colorClass) {
            const alertBox = document.getElementById('syncStatusAlert');
            document.getElementById('syncStatusText').innerText = msg;
            alertBox.className = `mb-4 p-3 rounded-lg text-xs font-medium flex items-center justify-between no-print ${colorClass}`;
            alertBox.classList.remove('hidden');
            setTimeout(() => alertBox.classList.add('hidden'), 4000);
        }

        // Export CSV dihapus dikit fungsinya jadi support data TXT juga
        function exportToCSV() {
            if (displayData.length === 0) return alert('Tidak ada data.');
            const headers = ['NO', 'SKU', 'DESKRIPSI', 'ALAMAT', 'HARGA', 'KS', 'QTY_SYS', 'QTY_PHY'];
            const rows = displayData.map((d, i) => [
                i + 1, `"${d.sku}"`, `"${d.desc.replace(/"/g, '""')}"`, `"${d.alamat}"`, d.price, `"${d.ks}"`, d.sys, d.phy !== null ? d.phy : ''
            ]);
            let csv = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
            const link = document.createElement('a');
            link.href = encodeURI(csv);
            link.download = `Data_Printsheet_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }
    </script>
</body>
</html>
