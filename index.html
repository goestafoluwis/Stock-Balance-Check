<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBC Repository & Tracker - Toko ASMD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#0284c7', 600: '#0369a1', 700: '#0369a1' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- HEADER -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-brand-500 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-boxes-stacked text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">SBC REPOSITORY & TRACKER</h1>
                    <p class="text-xs text-slate-400">Partial Stock Check System - Toko ASMD</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <select id="storeSelect" class="bg-slate-800 text-xs font-semibold text-slate-200 border border-slate-700 rounded-lg px-3 py-2">
                    <option value="ASMD" selected>Toko ASMD (Active)</option>
                    <option value="CAB_B" disabled>Toko Cabang B</option>
                </select>
                <button id="btnSync" onclick="fetchSheetData()" class="bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center space-x-2">
                    <i class="fa-solid fa-rotate" id="syncIcon"></i>
                    <span class="hidden sm:inline">Sync Data</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
        
        <div id="syncStatusAlert" class="hidden mb-4 p-3 rounded-lg text-xs font-medium flex items-center justify-between">
            <span id="syncStatusText"></span>
        </div>

        <!-- KPI CARDS -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-white rounded-xl border border-slate-200 p-4 flex items-center justify-between shadow-sm">
                <div>
                    <p class="text-xs font-medium text-slate-500 uppercase">Total SKU</p>
                    <h3 id="cardTotalSku" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-lg flex items-center justify-center text-lg">
                    <i class="fa-solid fa-barcode"></i>
                </div>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 p-4 flex flex-col justify-between shadow-sm">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs font-medium text-slate-500 uppercase">Progres Checking</p>
                        <h3 id="cardProgressPercent" class="text-2xl font-bold text-slate-800 mt-1">0%</h3>
                    </div>
                    <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-lg flex items-center justify-center text-lg">
                        <i class="fa-solid fa-list-check"></i>
                    </div>
                </div>
                <div class="mt-2">
                    <div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                        <div id="progressBar" class="bg-indigo-600 h-1.5 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 p-4 flex items-center justify-between shadow-sm">
                <div>
                    <p class="text-xs font-medium text-slate-500 uppercase">Akurasi SBC</p>
                    <h3 id="cardAccuracy" class="text-2xl font-bold text-emerald-600 mt-1">0%</h3>
                </div>
                <div class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-lg flex items-center justify-center text-lg">
                    <i class="fa-solid fa-bullseye"></i>
                </div>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 p-4 flex items-center justify-between shadow-sm">
                <div>
                    <p class="text-xs font-medium text-slate-500 uppercase">Total Variance</p>
                    <h3 id="cardTotalVariance" class="text-2xl font-bold text-slate-800 mt-1">0 <span class="text-xs">Pcs</span></h3>
                </div>
                <div id="cardVarianceIconBg" class="w-10 h-10 bg-slate-50 text-slate-600 rounded-lg flex items-center justify-center text-lg">
                    <i id="cardVarianceIcon" class="fa-solid fa-scale-balanced"></i>
                </div>
            </div>
        </div>

        <!-- CONTROLS & SLICER FILTER -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 mb-6 shadow-sm">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
                
                <!-- SLICER SHEET / RAK (FILTER BARU UTAMA) -->
                <div class="md:col-span-3">
                    <div class="relative">
                        <i class="fa-solid fa-layer-group absolute left-3 top-3 text-brand-600 text-xs"></i>
                        <select id="sheetSlicer" onchange="changeSheet(this.value)" class="w-full pl-8 pr-4 py-2 bg-brand-50/50 border border-brand-200 font-semibold rounded-lg text-xs text-brand-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500">
                            <!-- Populated dynamically -->
                        </select>
                    </div>
                </div>

                <!-- SEARCH BAR -->
                <div class="md:col-span-4 relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
                    <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Cari SKU, Barcode, Deskripsi, Alamat Rak..." class="w-full pl-8 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-lg text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-500">
                </div>

                <!-- STATUS FILTER -->
                <div class="md:col-span-3">
                    <select id="filterStatus" onchange="applyFilters()" class="w-full py-2 px-3 bg-slate-50 border border-slate-300 rounded-lg text-xs text-slate-700">
                        <option value="ALL">Semua Status</option>
                        <option value="MINUS">Selisih Minus (-)</option>
                        <option value="PLUS">Selisih Plus (+)</option>
                        <option value="MATCH">Akurat (0)</option>
                        <option value="UNCHECKED">Belum Dicek</option>
                    </select>
                </div>

                <!-- EXPORT BUTTON -->
                <div class="md:col-span-2">
                    <button onclick="exportToCSV()" class="w-full bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold py-2 px-3 rounded-lg flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-file-csv"></i>
                        <span>Export CSV</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- TABLE WORKSPACE -->
        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-[11px] font-bold uppercase tracking-wider border-b border-slate-200">
                            <th class="py-3 px-3 text-center">No</th>
                            <th class="py-3 px-3">SKU</th>
                            <th class="py-3 px-3">Barcode</th>
                            <th class="py-3 px-3 min-w-[200px]">Deskripsi</th>
                            <th class="py-3 px-3">Alamat</th>
                            <th class="py-3 px-3 text-right">Price</th>
                            <th class="py-3 px-3 text-center">KS</th>
                            <th class="py-3 px-3 text-right">SYS</th>
                            <th class="py-3 px-3 text-center w-28">PHY</th>
                            <th class="py-3 px-3 text-right">VAR</th>
                            <th class="py-3 px-3 text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTableBody" class="divide-y divide-slate-200 text-xs text-slate-700">
                    </tbody>
                </table>
            </div>
            <div id="emptyState" class="hidden p-8 text-center text-slate-400">
                <i class="fa-solid fa-box-open text-3xl mb-2"></i>
                <p class="text-sm font-medium">Tidak ada data SKU yang cocok.</p>
            </div>
        </div>

    </main>

    <script>
        const SPREADSHEET_ID = '1Ft7xFLiaHN5KDNZxBvrmsOl_o2K2UhMn0B21tPB8V70';
        
        // DATABASE DATABASE UTAMA DIHAPUS SUPAYA LOADING TIDAK BERAT
        const AVAILABLE_SHEETS = [
            { name: 'KS', label: 'KEEPSTOCK (KS)' },
            { name: 'OLAHAN NUSANTARA', label: 'OLAHAN NUSANTARA' },
            { name: 'KASIR', label: 'KASIR' },
            { name: 'AG01/Gondola Promo', label: 'AG01 / GONDOLA PROMO' },
            { name: 'STATIONERY', label: 'STATIONERY' },
            { name: 'DATA AREA', label: 'DATA AREA' }
        ];

        let activeSheet = AVAILABLE_SHEETS[0].name;
        let rawData = [];
        let filteredData = [];

        document.addEventListener('DOMContentLoaded', () => {
            initSlicerOptions();
            fetchSheetData();
        });

        // MASUKKAN PILIHAN SHEET KE DALAM SLICER DROPDOWN
        function initSlicerOptions() {
            const slicerSelect = document.getElementById('sheetSlicer');
            slicerSelect.innerHTML = '';

            AVAILABLE_SHEETS.forEach(sheet => {
                const opt = document.createElement('option');
                opt.value = sheet.name;
                opt.innerText = `Area: ${sheet.label}`;
                if(sheet.name === activeSheet) opt.selected = true;
                slicerSelect.appendChild(opt);
            });
        }

        function changeSheet(selectedSheetName) {
            activeSheet = selectedSheetName;
            fetchSheetData();
        }

        async function fetchSheetData() {
            const syncIcon = document.getElementById('syncIcon');
            syncIcon.classList.add('fa-spin');
            showStatusAlert(`Mengambil data dari area: ${activeSheet}...`, 'bg-blue-50 text-blue-700 border border-blue-200');

            const gvizUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(activeSheet)}`;

            try {
                const response = await fetch(gvizUrl);
                const text = await response.text();
                const jsonText = text.substring(47, text.length - 2);
                const json = JSON.parse(jsonText);
                
                if (json.table && json.table.rows) {
                    rawData = parseRowsByColumnStructure(json.table.rows);
                    showStatusAlert(`Data ${activeSheet} berhasil dipicu!`, 'bg-emerald-50 text-emerald-700 border border-emerald-200');
                } else {
                    rawData = [];
                }
            } catch (error) {
                console.error('Error fetching sheet data:', error);
                showStatusAlert('Gagal membaca sheet. Pastikan sheet dipublikasikan.', 'bg-rose-50 text-rose-700 border border-rose-200');
                rawData = [];
            } finally {
                syncIcon.classList.remove('fa-spin');
                applyFilters();
            }
        }

        function parseRowsByColumnStructure(rows) {
            const parsed = [];
            rows.forEach((row, idx) => {
                const c = row.c;
                if (!c || c.length === 0) return;

                const sku = c[0] && c[0].v !== null ? String(c[0].v) : '';
                if (!sku || sku.toUpperCase() === 'SKU') return;

                // Mapping ulang sesuai screenshot Google Sheet terbaru
                const desc = c[1] && c[1].v !== null ? String(c[1].v) : '-';
                const alamat = c[2] && c[2].v !== null ? String(c[2].v) : '-';
                const price = c[3] && c[3].v !== null ? Number(c[3].v) : 0;
                const ks = c[4] && c[4].v !== null ? String(c[4].v) : '-';
                const sys = c[5] && c[5].v !== null ? Number(c[5].v) : 0;
                
                // Karena kolom barcode nggak kelihatan di sheet, sementara disamakan dengan SKU
                const barcode = sku; 

                parsed.push({
                    no: idx,
                    sku: sku,
                    barcode: barcode,
                    desc: desc,
                    alamat: alamat,
                    price: isNaN(price) ? 0 : price,
                    ks: ks,
                    sys: isNaN(sys) ? 0 : sys,
                    phy: null
                });
            });
            return parsed;
        }

        function applyFilters() {
            const searchValue = document.getElementById('searchInput').value.toLowerCase().trim();
            const statusValue = document.getElementById('filterStatus').value;

            filteredData = rawData.filter(item => {
                const matchSearch = item.sku.toLowerCase().includes(searchValue) ||
                                    item.barcode.toLowerCase().includes(searchValue) ||
                                    item.desc.toLowerCase().includes(searchValue) ||
                                    item.alamat.toLowerCase().includes(searchValue);

                let matchStatus = true;
                const varVal = item.phy !== null ? (item.phy - item.sys) : null;

                if (statusValue === 'MINUS') matchStatus = item.phy !== null && varVal < 0;
                else if (statusValue === 'PLUS') matchStatus = item.phy !== null && varVal > 0;
                else if (statusValue === 'MATCH') matchStatus = item.phy !== null && varVal === 0;
                else if (statusValue === 'UNCHECKED') matchStatus = item.phy === null;

                return matchSearch && matchStatus;
            });

            renderTable();
            calculateMetrics();
        }

        function renderTable() {
            const tbody = document.getElementById('inventoryTableBody');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';

            if (filteredData.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            filteredData.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors border-b border-slate-100";

                const isChecked = item.phy !== null;
                const variance = isChecked ? (item.phy - item.sys) : 0;
                
                let badgeHtml = '';
                if (!isChecked) {
                    badgeHtml = `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-slate-100 text-slate-600">Belum Cek</span>`;
                } else if (variance === 0) {
                    badgeHtml = `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-100 text-emerald-800">Akurat</span>`;
                } else if (variance < 0) {
                    badgeHtml = `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-rose-100 text-rose-800">Minus (${variance})</span>`;
                } else {
                    badgeHtml = `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-amber-100 text-amber-800">Plus (+${variance})</span>`;
                }

                const formattedPrice = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(item.price);

                let varColor = 'text-slate-400';
                if (isChecked) {
                    if (variance === 0) varColor = 'text-emerald-600 font-bold';
                    else if (variance < 0) varColor = 'text-rose-600 font-bold';
                    else varColor = 'text-amber-600 font-bold';
                }

                tr.innerHTML = `
                    <td class="py-2.5 px-3 text-center text-slate-400 font-mono">${index + 1}</td>
                    <td class="py-2.5 px-3 font-mono font-bold text-slate-900">${item.sku}</td>
                    <td class="py-2.5 px-3 font-mono text-slate-500">${item.barcode}</td>
                    <td class="py-2.5 px-3 font-medium text-slate-800">${item.desc}</td>
                    <td class="py-2.5 px-3 font-mono text-slate-500">${item.alamat}</td>
                    <td class="py-2.5 px-3 text-right font-mono text-slate-600">${formattedPrice}</td>
                    <td class="py-2.5 px-3 text-center">
                        <span class="px-1.5 py-0.5 text-[10px] font-semibold rounded ${item.ks !== '#N/A' && item.ks !== '-' ? 'bg-indigo-50 text-indigo-700' : 'text-slate-400'}">${item.ks}</span>
                    </td>
                    <td class="py-2.5 px-3 text-right font-mono font-semibold text-slate-700">${item.sys}</td>
                    <td class="py-2.5 px-3 text-center">
                        <input type="number" min="0" 
                            value="${item.phy !== null ? item.phy : ''}" 
                            placeholder="-"
                            oninput="updateQty('${item.sku}', this.value)"
                            class="w-20 text-center font-mono font-bold py-1 px-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-brand-500"
                        />
                    </td>
                    <td class="py-2.5 px-3 text-right font-mono ${varColor}">
                        ${isChecked ? (variance > 0 ? '+' + variance : variance) : '-'}
                    </td>
                    <td class="py-2.5 px-3 text-center">${badgeHtml}</td>
                `;

                tbody.appendChild(tr);
            });
        }

        function updateQty(sku, val) {
            const item = rawData.find(d => d.sku === sku);
            if (item) {
                item.phy = val !== '' ? parseInt(val, 10) : null;
                applyFilters();
            }
        }

        function calculateMetrics() {
            const totalSku = filteredData.length;
            const checkedItems = filteredData.filter(d => d.phy !== null);
            const totalChecked = checkedItems.length;

            const progressPercent = totalSku > 0 ? Math.round((totalChecked / totalSku) * 100) : 0;
            const accurateItems = checkedItems.filter(d => (d.phy - d.sys) === 0);
            const accuracyPercent = totalChecked > 0 ? Math.round((accurateItems.length / totalChecked) * 100) : 0;
            const totalVariance = checkedItems.reduce((acc, curr) => acc + (curr.phy - curr.sys), 0);

            document.getElementById('cardTotalSku').innerText = totalSku;
            document.getElementById('cardProgressPercent').innerText = `${progressPercent}%`;
            document.getElementById('progressBar').style.width = `${progressPercent}%`;
            document.getElementById('cardAccuracy').innerText = `${accuracyPercent}%`;

            const cardVariance = document.getElementById('cardTotalVariance');
            cardVariance.innerText = `${totalVariance > 0 ? '+' : ''}${totalVariance} Pcs`;
        }

        function exportToCSV() {
            if (filteredData.length === 0) return alert('Tidak ada data.');

            const headers = ['NO', 'SKU', 'BARCODE', 'DESKRIPSI', 'ALAMAT', 'HARGA', 'KS', 'QTY_SYS', 'QTY_PHY', 'VARIANCE'];
            const rows = filteredData.map((d, i) => [
                i + 1, `"${d.sku}"`, `"${d.barcode}"`, `"${d.desc.replace(/"/g, '""')}"`,
                `"${d.alamat}"`, d.price, `"${d.ks}"`, d.sys, d.phy !== null ? d.phy : '',
                d.phy !== null ? (d.phy - d.sys) : ''
            ]);

            let csv = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
            const link = document.createElement('a');
            link.href = encodeURI(csv);
            link.download = `SBC_${activeSheet}_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function showStatusAlert(msg, colorClass) {
            const alertBox = document.getElementById('syncStatusAlert');
            document.getElementById('syncStatusText').innerText = msg;
            alertBox.className = `mb-4 p-3 rounded-lg text-xs font-medium flex items-center justify-between ${colorClass}`;
            alertBox.classList.remove('hidden');
            setTimeout(() => alertBox.classList.add('hidden'), 4000);
        }
    </script>
</body>
</html>
